server {
  listen 80;
  listen [::]:80;
  server_name _;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;
  charset utf-8;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json application/manifest+json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(self), camera=(), microphone=()" always;
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com https://timeapi.io https://cloudflare.com; worker-src 'self'; manifest-src 'self'" always;

  location = /sw.js {
    expires -1;
    try_files $uri =404;
  }

  location = /registerSW.js {
    expires -1;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    expires -1;
    try_files $uri =404;
  }

  location = /index.html {
    expires -1;
    try_files $uri =404;
  }

  location = /favicon.svg {
    expires 30d;
    try_files $uri =404;
  }

  location ^~ /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  location ~* \.(?:png|webp|woff2|ico)$ {
    expires 30d;
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
